name: Loto workflow watchdog

on:
  repository_dispatch:
    types: [watchdog]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-evening-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check and start notifier
        env:
          GH_TOKEN: ${{ secrets.WATCHDOG_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          hour="$(TZ=Asia/Almaty date +%H)"
          if [ "$hour" -lt 21 ] || [ "$hour" -gt 23 ]; then
            echo "Outside evening window in Asia/Almaty: $hour"
            exit 0
          fi

          runs="$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/loto.yml/runs?per_page=20")"

          active="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "Notifier is already active: ${active} run(s)"
            exit 0
          fi

          echo "No active notifier run; starting loto.yml"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/loto.yml/dispatches" \
            -d '{"ref":"main"}'
