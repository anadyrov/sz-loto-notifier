name: Loto 5/36 and 6/49 notifier

on:
  repository_dispatch:
    types: [watchdog, loto536, loto649]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loto-${{ github.event.action || 'manual' }}-notifier
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Restore notifier state
        uses: actions/cache/restore@v5
        with:
          path: |
            last_draw_536.txt
            status_536.json
            last_draw_649.txt
            status_649.json
          key: loto-state-${{ github.run_id }}
          restore-keys: loto-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Poll SZ.KZ and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMS_ENABLED: "false"
          TIMEZONE: Asia/Almaty
          POLL_SECONDS: "60"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "${{ github.event.client_payload.probe }}" = "true" ]; then
            python main.py --probe
          elif [ "${{ github.event.action }}" = "loto649" ]; then
            python main.py --window --game 649
          else
            python main.py --window --game 536
          fi

      - name: Prepare notifier state
        if: always()
        run: touch last_draw_536.txt status_536.json last_draw_649.txt status_649.json

      - name: Save notifier state
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            last_draw_536.txt
            status_536.json
            last_draw_649.txt
            status_649.json
          key: loto-state-${{ github.run_id }}
