name: Loto results notifier

on:
  schedule:
    # 21:00-23:55 Asia/Almaty is 16:00-18:55 UTC.
    - cron: "*/5 16-18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Restore notifier state
        uses: actions/cache/restore@v4
        with:
          path: |
            last_draw_*.txt
            status_*.json
          key: loto-state-${{ github.run_id }}
          restore-keys: loto-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check lottery results once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMS_ENABLED: ${{ secrets.SMS_ENABLED }}
          SMS_PHONE: ${{ secrets.SMS_PHONE }}
          MOBIZON_API_KEY: ${{ secrets.MOBIZON_API_KEY }}
        run: python main.py --once

      - name: Save notifier state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            last_draw_*.txt
            status_*.json
          key: loto-state-${{ github.run_id }}