name: Loto 5/36 notifier

on:
  repository_dispatch:
    types: [watchdog]
  workflow_dispatch:
  schedule:
    # Emergency fallback only. Primary trigger is cron-job.org.
    - cron: "5 16 * * *"

permissions:
  contents: read

concurrency:
  group: loto-536-notifier
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Restore notifier state
        uses: actions/cache/restore@v5
        with:
          path: |
            last_draw_536.txt
            status_536.json
          key: loto-536-state-${{ github.run_id }}
          restore-keys: loto-536-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Poll SZ.KZ and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMS_ENABLED: "false"
          TIMEZONE: Asia/Almaty
          POLL_SECONDS: "60"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python main.py --probe
          else
            python main.py --window
          fi

      - name: Prepare notifier state
        if: always()
        run: touch last_draw_536.txt status_536.json

      - name: Save notifier state
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            last_draw_536.txt
            status_536.json
          key: loto-536-state-${{ github.run_id }}
